<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Terdampar</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b1a22"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Terdampar"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css"></head><body>
<canvas id="c"></canvas>
<div id="load"><div class="lg">TERDAMPAR</div><div class="sub" id="ltxt">Menyiapkan pulau…</div><div class="bar"><i id="lbar"></i></div></div>
<div id="lobby" class="hide">
 <div class="ttl"><h1>TERDAMPAR</h1><p>Pesawatmu jatuh. Bertahan hidup, rakit lagi, dan keluar dari pulau ini.</p></div>
 <div class="card">
  <label>Nama<input id="nm" maxlength="16" placeholder="Nama kamu"></label>
  <div class="row"><div class="seg" id="sG"><button data-v="m" class="on">Cowok</button><button data-v="f">Cewek</button></div><div class="seg" id="sO"><button data-v="peasant" class="on">Santai</button><button data-v="ranger">Ranger</button></div></div>
  <div class="row"><div class="seg" id="sH"></div></div>
  <div class="row sw" id="sC"></div>
  <div class="row sw" id="sS"></div>
  <hr>
  <button class="pri" id="bNew">Buat Room Baru</button>
  <button id="bReset" class="ghost hide">Mulai dari awal</button>
  <div class="row join"><input id="cd" maxlength="6" placeholder="KODE" autocapitalize="characters"><button id="bJoin">Gabung</button></div>
  <div class="row q"><span>Grafik</span><div class="seg" id="sQ"><button data-v="low">Rendah</button><button data-v="med">Sedang</button><button data-v="high">Tinggi</button></div></div>
  <div id="err"></div>
 </div>
</div>
<div id="hud" class="hide">
 <div id="stats"><div class="st"><b>❤️</b><i><u id="vHp"></u></i></div><div class="st"><b>🍖</b><i><u id="vFood"></u></i></div><div class="st"><b>💧</b><i><u id="vWater"></u></i></div><div class="st"><b>⚡</b><i><u id="vStam"></u></i></div></div>
 <div id="comp"><div id="compI"></div></div>
 <div id="tr"><div id="clock"></div><div id="room"></div><div id="obj"></div></div>
 <div id="wp"><i>▲</i><span></span></div><div id="cross"></div><div id="prompt"></div><div id="tgt"><span></span><i><u></u></i></div>
 <div id="hot"></div><div id="got"></div><div id="toast"></div><div id="chat"><div id="log"></div><input id="ci" maxlength="160" placeholder="Enter untuk kirim" class="hide"></div><div id="fuel" class="hide"><div>⛽ <span id="fv"></span></div><div id="spd"></div></div>
 <div id="holdbar" class="hide"><i></i></div>
</div>
<div id="panel" class="hide"><div class="pbox"><div class="tabs" id="tabs"></div><div class="pbody" id="pbody"></div><button class="x" id="px">✕</button></div></div>
<div id="death" class="hide"><h2>Kamu tewas</h2><p id="dmsg"></p><button class="pri" id="bResp">Bangun lagi</button></div>
<div id="ending" class="hide"><h1>KAMU SELAMAT</h1><div id="estat"></div><button class="pri" onclick="location.reload()">Kembali</button></div>
<div id="touch" class="hide"><div id="joy"><i></i></div><div id="tb"><button data-k="jump">⤒</button><button data-k="crouch">⤓</button><button data-k="use">E</button><button data-k="cam">👁</button><button data-k="bag">🎒</button><button data-k="build">🔨</button><button data-k="sprint">»</button><button data-k="attack" class="big">✊</button></div></div>
<div id="intro" class="hide"></div>
<script type="module" src="game.js"></script></body></html>
